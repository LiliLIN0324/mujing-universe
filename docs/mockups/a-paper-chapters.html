<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>方案 A · 纸签章节</title>
<style>
  :root { --bg:#F6F5F3; --ink:#1A1A1C; --muted:#6A655F; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Songti SC","Noto Serif SC","PingFang SC",serif; }
  .stage { position:relative; height:100vh; height:100dvh; overflow:hidden; background:var(--bg); }
  .stage img.bg {
    position:absolute; inset:0; width:100%; height:116%; top:-8vh;
    object-fit:cover; object-position:18% 50%;
  }
  .plate {
    position:absolute; left:48px; bottom:40px; z-index:2;
    width:min(460px, calc(100% - 140px));
    padding:26px 28px 22px 28px;
    background:rgba(246,245,243,0.94);
    color:var(--ink);
  }
  .plate::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:rgba(26,26,28,0.14);
  }
  .plate::after {
    content:""; position:absolute; left:0; top:0; width:2px; height:18%; background:#1A1A1C;
  }
  .kicker { margin:0 0 10px; font-family:"PingFang SC","Noto Sans SC",sans-serif; font-size:12px; letter-spacing:0.16em; color:var(--muted); }
  .kicker b { color:var(--ink); font-weight:500; }
  h1 { margin:0 0 10px; font-size:40px; font-weight:600; line-height:1.18; letter-spacing:-0.03em; }
  .sum { margin:0 0 18px; font-family:"PingFang SC","Noto Sans SC",sans-serif; font-size:15px; line-height:1.65; color:#4a463f; }
  .row { display:flex; align-items:center; gap:18px; font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  .pill { border:0; background:#1A1A1C; color:#F6F5F3; border-radius:999px; padding:11px 18px; font-size:13px; letter-spacing:0.08em; }
  .link { font-size:14px; border-bottom:1px solid rgba(26,26,28,0.55); padding-bottom:2px; text-decoration:none; color:inherit; }
  .hint { margin:16px 0 0; font-family:"PingFang SC","Noto Sans SC",sans-serif; font-size:12px; letter-spacing:0.18em; color:#8a847c; }
  .rail {
    position:absolute; right:32px; top:22%; z-index:3;
    display:flex; flex-direction:column; gap:4px;
    padding:10px 7px; background:rgba(246,245,243,0.92); border-radius:999px;
  }
  .rail i { display:block; width:5px; height:5px; margin:5px 6px; border-radius:99px; background:rgba(26,26,28,0.32); }
  .rail i.on { height:18px; margin:2px 6px; background:#1A1A1C; }
  .word { position:absolute; top:28px; left:48px; z-index:3; font-family:"PingFang SC",sans-serif; letter-spacing:0.18em; font-size:15px; font-weight:600; color:rgba(26,26,28,0.0); }
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="../../public/ring/0.jpg" alt="当代西湖繁胜全景图"/>
  <div class="plate">
    <p class="kicker"><b>01</b> / 10　音画 · 进行中</p>
    <h1>当代西湖繁胜全景图</h1>
    <p class="sum">以宋画长卷重绘当代西湖，画面由声音转译生成。</p>
    <div class="row">
      <button class="pill" type="button">聆听图景</button>
      <a class="link" href="#">查看作品 →</a>
    </div>
    <p class="hint">下滑换一件</p>
  </div>
  <div class="rail" aria-hidden="true">
    <i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
</div>
</body>
</html>
