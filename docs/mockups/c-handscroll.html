<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>方案 C · 横卷错位</title>
<style>
  :root { --bg:#F6F5F3; --ink:#1A1A1C; --muted:#6A655F; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  .stage { position:relative; height:100vh; height:100dvh; overflow:hidden; background:var(--bg); }
  .strip {
    position:absolute; top:0; bottom:0; left:0;
    display:flex; gap:16px; align-items:stretch;
    height:100%;
    transform:translateX(-8%);
  }
  .strip figure { margin:0; height:100%; flex:0 0 86vw; overflow:hidden; background:#e7e3dc; }
  .strip img { width:100%; height:100%; object-fit:cover; object-position:30% 50%; display:block; }
  .plate {
    position:absolute; left:48px; bottom:40px;
    width:min(440px, calc(100% - 96px));
    padding:24px 26px 20px;
    background:rgba(246,245,243,0.94);
  }
  .kicker { margin:0 0 8px; font-size:12px; letter-spacing:0.16em; color:var(--muted); }
  h1 { margin:0 0 8px; font-family:"Songti SC","Noto Serif SC",serif; font-size:36px; font-weight:600; letter-spacing:-0.03em; }
  p { margin:0; font-size:15px; line-height:1.6; color:#4a463f; }
  .hint { margin-top:14px; font-size:12px; letter-spacing:0.18em; color:#8a847c; }
</style>
</head>
<body>
<div class="stage">
  <div class="strip">
    <figure><img src="../../public/ring/0.jpg" alt="当代西湖繁胜全景图"/></figure>
    <figure><img src="../../public/ring/1.jpg" alt="下一件作品"/></figure>
    <figure><img src="../../public/ring/3.jpg" alt="再下一件"/></figure>
  </div>
  <div class="plate">
    <p class="kicker">01 / 10　音画 · 进行中</p>
    <h1>当代西湖繁胜全景图</h1>
    <p>以宋画长卷重绘当代西湖，画面由声音转译生成。</p>
    <p class="hint">向左，长卷继续</p>
  </div>
</div>
</body>
</html>
