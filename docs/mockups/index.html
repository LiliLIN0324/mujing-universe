<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>首页方案 · 幕景宇宙</title>
<style>
  :root { --bg:#F6F5F3; --ink:#1A1A1C; --muted:#6A655F; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Noto Sans SC",sans-serif; }
  main { width:min(880px, calc(100% - 48px)); margin:48px auto 80px; }
  h1 { font-weight:600; font-size:28px; letter-spacing:-0.03em; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.7; }
  a { color:inherit; }
  ol { padding:0; list-style:none; }
  li { border-top:1px solid rgba(26,26,28,0.12); padding:18px 0; }
  b { font-weight:600; color:var(--ink); }
</style>
</head>
<body>
<main>
  <h1>首页沉浸方案</h1>
  <p>只动首页。背景保持浅灰 #F6F5F3，画面上不加压暗、不铺墨晕。已实现的是方案 A。</p>
  <ol>
    <li><a href="./a-paper-chapters.html"><b>方案 A · 纸签章节</b></a>（<a href="./a-paper-chapters.jpg">静帧</a>）<br/>整屏一幅作品。标题落在浅灰纸签上。滚动时两章交叉淡入，画面从略放大收到原大。右侧是等距刻度。这一版已写进首页。</li>
    <li><a href="./b-paper-frame.html"><b>方案 B · 留白镜框</b></a>（<a href="./b-paper-frame.jpg">静帧</a>）<br/>画面四边留出浅灰，字写在框外。更安静，但第一眼不够满。</li>
    <li><a href="./c-handscroll.html"><b>方案 C · 横卷错位</b></a>（<a href="./c-handscroll.jpg">静帧</a>）<br/>长卷向左缓移，下一件从右侧露出一条。流动最强，手机上不好握。</li>
  </ol>
</main>
</body>
</html>
