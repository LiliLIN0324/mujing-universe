<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西湖清趣</title>
<style>
:root{--ink:#1c1a16;--soft:#5a554b;--faint:#9a9384;--rule:#ddd5c6;--bg:#f7f4ec;--accent:#8a2f2f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Songti SC","STSong",serif}
/* 三段竖滚：scroll-snap 强制吸附，每段占满视口 */
.scroll{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}
.scroll::-webkit-scrollbar-track{background:transparent}
.section{height:100vh;scroll-snap-align:start;position:relative;overflow:hidden;background:#fff}
.section iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
/* 形制切换：复原段右下角一个小圆点，不抢内容 */
.dim-btn{position:absolute;right:18px;bottom:22px;z-index:20;display:flex;gap:0;border:1px solid var(--rule);border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(4px);overflow:hidden}
.dim-btn button{border:0;background:none;font:inherit;font-size:12px;padding:5px 12px;cursor:pointer;color:var(--soft);white-space:nowrap}
.dim-btn button.on{background:var(--ink);color:#fff}
/* 段标签：极简左下一个小字，对外 demo 标识层但不抢视线 */
.tag{position:absolute;left:18px;bottom:22px;font-size:11px;letter-spacing:.18em;color:var(--faint);pointer-events:none;user-select:none;z-index:20}
/* 竖向指示器（右侧）：给用户知道有三段 */
.pips{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:30;pointer-events:none}
.pips span{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.2);transition:transform .25s,background .25s}
.pips span.on{background:var(--ink);transform:scale(1.5)}
/* 懒加载垫底：iframe src 尚未注入前不露白 */
.section.await{background:linear-gradient(180deg,#efe9da,#f7f4ec);display:flex;align-items:center;justify-content:center}
.section.await::after{content:"";width:28px;height:28px;border:2px solid var(--rule);border-top-color:var(--soft);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){
  .dim-btn{right:10px;bottom:18px}.dim-btn button{font-size:11px;padding:4px 9px}
  .tag{left:12px;bottom:16px;font-size:10px}
}
</style>
</head>
<body>
<div class="scroll" id="scroll">

  <!-- 第 1 段：复原（默认首段，2.5D vs 立体用右下角圆点切） -->
  <section class="section await" data-layer="fuyuan" data-src="../lakeside/">
    <iframe class="fuyuan-main" data-loaded="0" referrerpolicy="no-referrer" allow="autoplay; fullscreen"></iframe>
    <iframe class="fuyuan-3d" data-src="../lakeside3d/" data-loaded="0" data-paused="true" referrerpolicy="no-referrer" allow="autoplay; fullscreen"
      style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#141e29;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s"></iframe>
    <div class="dim-btn" role="tablist" aria-label="形制"><button data-dim="2d" class="on">2.5D</button><button data-dim="3d">立体</button></div>
    <div class="tag">复原</div>
  </section>

  <!-- 第 2 段：今图对照 -->
  <section class="section await" data-layer="jintu" data-src="https://pub-3209bcb7fc36444a914deb0e70ceca92.r2.dev/qingqu-scroll-labels/yuanxiang-3d/index.html?v=showcase-20261024">
    <iframe referrerpolicy="no-referrer"></iframe>
    <div class="tag">今图</div>
  </section>

  <!-- 第 3 段：画卷（R2 标注工作台） -->
  <section class="section await" data-layer="huajuan" data-src="https://pub-3209bcb7fc36444a914deb0e70ceca92.r2.dev/qingqu-scroll-labels/index.html">
    <iframe referrerpolicy="no-referrer"></iframe>
    <div class="tag">画卷</div>
  </section>

</div>
<div class="pips" aria-hidden="true" id="pips"><span class="on"></span><span></span><span></span></div>

<script>
/* ===== 极简壳：三段竖滚 + IntersectionObserver 懒加载 + pause 通道 ===== */
const SECTION_ORDER=['fuyuan','jintu','huajuan'];
const sections=[...document.querySelectorAll('.section')];
const pipEls=[...document.querySelectorAll('.pips span')];
const scrollEl=document.getElementById('scroll');
const dimBtns=[...document.querySelectorAll('.dim-btn button')];

const state={active:'fuyuan',dim:'2d',scene:'all',name:null};

/* 懒加载：滚入视口才给 iframe 赋 src（对外 demo 全预载，避免 IO 竞态） */
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    const sec=e.target;
    const layer=sec.dataset.layer;
    if(e.isIntersecting){
      state.active=layer;
      pipEls.forEach((p,i)=>p.classList.toggle('on',SECTION_ORDER[i]===layer));
      /* 深链同步 */
      const h=new URLSearchParams(location.hash.slice(1));
      h.set('layer',layer);
      history.replaceState(null,'','#'+h.toString());
      /* 立体层暂停解除 */
      if(layer==='fuyuan'){
        const d3=sec.querySelector('.fuyuan-3d');
        if(d3.contentWindow)d3.contentWindow.postMessage({xihuPause:false},'*');
      }
    }else{
      /* 滚出视口：Three.js 立体 iframe 暂停 */
      if(layer==='fuyuan'){
        const d3=sec.querySelector('.fuyuan-3d');
        if(d3.contentWindow)d3.contentWindow.postMessage({xihuPause:true},'*');
      }
    }
  });
},{threshold:.35});
sections.forEach(s=>io.observe(s));

/* 预载所有 iframe（对外 demo 让三段秒开，不省流量） */
(function preloadAll(){
  sections.forEach((sec,i)=>{
    const layer=sec.dataset.layer;
    const iframe=sec.querySelector('iframe');
    if(layer==='fuyuan'){
      const main=sec.querySelector('.fuyuan-main');
      if(!main.src)main.src=sec.dataset.src;
      const d3=sec.querySelector('.fuyuan-3d');
      if(!d3.src)d3.src=d3.dataset.src;
      /* 立体 iframe load 后，如果 dim=3d 要立即 crossfade 过去 */
      d3.addEventListener('load',()=>{
        if(state.dim==='3d'){
          d3.style.opacity='1';d3.style.visibility='visible';d3.style.pointerEvents='auto';
          main.style.opacity='0';main.style.visibility='hidden';main.style.pointerEvents='none';
          pushFuyuan();
        }
      },{once:true});
    }else{
      if(!iframe.src)iframe.src=sec.dataset.src;
    }
  });
  /* 给一点时间让 iframe 加载，再把 await 类移除 */
  setTimeout(()=>sections.forEach(s=>s.classList.remove('await')),300);
})();

/* ===== 形制切换：复原段内 2.5D ↔ 立体，crossfade 350ms ===== */
dimBtns.forEach(b=>{
  b.onclick=()=>{
    state.dim=b.dataset.dim;
    dimBtns.forEach(x=>x.classList.toggle('on',x.dataset.dim===state.dim));
    const sec=sections[0];
    const main=sec.querySelector('.fuyuan-main');
    const d3=sec.querySelector('.fuyuan-3d');
    if(state.dim==='3d'){
      if(!d3.src)d3.src=d3.dataset.src;
      d3.style.opacity='1';d3.style.visibility='visible';d3.style.pointerEvents='auto';
      main.style.opacity='0';main.style.visibility='hidden';main.style.pointerEvents='none';
      /* 给点时间让 crossfade 起，再补发选中消息（3D 页可能刚加载完） */
      setTimeout(pushFuyuan,200);
    }else{
      d3.style.opacity='0';d3.style.visibility='hidden';d3.style.pointerEvents='none';
      main.style.opacity='1';main.style.visibility='visible';main.style.pointerEvents='auto';
      d3.contentWindow?.postMessage?.({xihuPause:true},'*');
    }
  };
});

/* ===== 复原层内 postMessage 联动：选中 / 视角 ===== */
function activeFuyuan(){ return state.dim==='3d'?'fuyuan-3d':'.fuyuan-main'; }
function pushFuyuan(){
  /* 极简 demo 版：没有十景 chips 也没有细选 names，默认让复原层自己在 HOME。
     将来壳加选点时在这里统一 postMessage xihuSelect / xihuView。 */
  if(state.dim==='3d'){
    const d3=sections[0].querySelector('.fuyuan-3d');
    if(d3.contentWindow){
      try{ d3.contentWindow.postMessage({xihuView:'twod'},'*'); }catch(_){}
    }
  }else{
    const main=sections[0].querySelector('.fuyuan-main');
    if(main.contentWindow){
      try{ main.contentWindow.postMessage({xihuView:'twod'},'*'); }catch(_){}
    }
  }
}

/* ===== 深链：#layer=fuyuan|jintu|huajuan&dim=3d ===== */
(function initFromHash(){
  const h=new URLSearchParams(location.hash.slice(1));
  const dim=h.get('dim')||'2d';
  const layer=h.get('layer')||'fuyuan';
  state.dim=dim==='3d'?'3d':'2d';
  dimBtns.forEach(b=>b.classList.toggle('on',b.dataset.dim===state.dim));
  if(layer&&SECTION_ORDER.includes(layer)){
    const idx=SECTION_ORDER.indexOf(layer);
    /* 滚动容器是 .scroll div，不是 window，所以硬设 scrollTop */
    requestAnimationFrame(()=>{ scrollEl.scrollTop=idx*scrollEl.clientHeight; });
  }
  /* 复原段首段待命：先给 2.5D 注 src（让它在视口下方预载） */
  const f=sections[0].querySelector('.fuyuan-main');
  if(!f.src)f.src=sections[0].dataset.src;
  /* 深链 dim=3d 时，dim 按钮先亮——crossfade 等 fuyuan-3d load 回调里执行 */
  if(state.dim==='3d'){
    const d3=sections[0].querySelector('.fuyuan-3d');
    if(!d3.src)d3.src=d3.dataset.src;
    /* d3.addEventListener('load', ...) 已在 preloadAll 里挂好 */
  }
})();

/* ===== 滚动到哪段，pip 就亮哪段（IO 已做一次，这里兜一下） ===== */
scrollEl.addEventListener('scroll',()=>{
  const rect=scrollEl.getBoundingClientRect();
  const mid=rect.top+rect.height/2;
  let closest=0,best=Infinity;
  sections.forEach((s,i)=>{
    const r=s.getBoundingClientRect();
    const c=r.top+r.height/2;
    if(Math.abs(c-mid)<best){best=Math.abs(c-mid);closest=i;}
  });
  pipEls.forEach((p,i)=>p.classList.toggle('on',i===closest));
},{passive:true});
</script>
</body>
</html>
