<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>西湖清趣 · 集成壳（三层 + 十景）</title>
<style>
:root{--ink:#1c1a16;--soft:#5a554b;--faint:#9a9384;--rule:#ddd5c6;--bg:#f7f4ec;--accent:#8a2f2f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Songti SC","STSong",serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px 0;flex:0 0 auto}
.brand{font-size:11px;letter-spacing:.18em;color:var(--faint)}
h1{margin:2px 0 0;font-size:19px;letter-spacing:.04em;font-weight:600}
/* §7.1 Segment 三段 */
.seg{display:inline-flex;margin-top:12px;border:1px solid var(--rule);background:#fff}
.seg button{border:0;background:none;font:inherit;font-size:15px;padding:8px 26px;cursor:pointer;color:var(--soft);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
/* §7.2 十景 chips：Segment 下方一条横滑 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 14px;border:1px solid var(--rule);border-radius:999px;background:#fff;font:inherit;font-size:13px;color:var(--soft);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:hover{color:var(--ink)}
.chip.on:hover{color:#fff}
/* §7.3 缺对齐弱提示 */
.notice{min-height:22px;font-size:12.5px;color:var(--faint);letter-spacing:.03em;padding:2px 2px 0}
/* 主画区 */
.stage{position:relative;flex:1 1 auto;margin:6px 22px 0;border:1px solid var(--rule);background:#fff;overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.stage iframe.on{display:block}
/* 层内次级入口（圆相）与章节串（看完一程）：不抢主按钮 */
.sub{position:absolute;right:14px;bottom:12px;font-size:12.5px;color:var(--faint);background:rgba(255,255,255,.88);padding:4px 10px;border:1px solid var(--rule)}
.sub button{border:0;background:none;font:inherit;font-size:12.5px;color:var(--soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0}
.sub button:hover{color:var(--ink)}
footer{flex:0 0 auto;padding:10px 22px 12px;font-size:11.5px;color:var(--faint);letter-spacing:.05em;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer .names button{border:0;background:none;font:inherit;font-size:11.5px;color:var(--soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:0 4px}
footer .names button.on{color:var(--accent)}
@media(max-width:760px){
  header{padding:10px 14px 0}
  h1{font-size:16px}
  .seg{display:flex}.seg button{flex:1;padding:8px 0;font-size:14px}
  .stage{margin:4px 12px 0}
  footer{padding:8px 14px 10px}
}
</style>
</head>
<body>
<header>
  <p class="brand">西湖清趣 · 集成壳（进度3 原型）</p>
  <h1>同一卷西湖 · 三层互指</h1>
  <div class="seg" role="tablist" aria-label="三层切换" id="seg">
    <button data-layer="huajuan" class="on">画卷</button>
    <button data-layer="fuyuan">复原</button>
    <button data-layer="jintu">今图</button>
  </div>
  <div class="chips" id="chips" aria-label="十景滤镜"></div>
  <p class="notice" id="notice"></p>
</header>
<div class="stage" id="stage">
  <iframe data-layer="huajuan" class="on" title="画卷层" src="https://pub-3209bcb7fc36444a914deb0e70ceca92.r2.dev/qingqu-scroll-labels/index.html" referrerpolicy="no-referrer"></iframe>
  <iframe data-layer="fuyuan" title="南宋复原层" data-src="../lakeside/" referrerpolicy="no-referrer"></iframe>
  <iframe data-layer="jintu" title="今图对照层" data-src="https://pub-3209bcb7fc36444a914deb0e70ceca92.r2.dev/qingqu-scroll-labels/yuanxiang-3d/index.html?v=showcase-20261024" referrerpolicy="no-referrer"></iframe>
  <iframe data-layer="yuanxiang" title="圆相观感（壳内）" data-src="https://pub-3209bcb7fc36444a914deb0e70ceca92.r2.dev/qingqu-scroll-labels/yuanxiang-3d/index.html?v=showcase-20261024" referrerpolicy="no-referrer"></iframe>
  <div class="sub" id="sub"></div>
</div>
<footer>
  <span>古今对照为示意，非测绘级。</span>
  <span class="names" id="names">细选：<button data-name="duanqiao">断桥</button><button data-name="baoshuta">保叔塔</button><button data-name="leifengta">雷峰塔</button></span>
</footer>
<script>
/* ===== 选中总线（同一壳、同一选中态）===== */
const SCENES=[
 {id:'all',label:'全卷'},
 {id:'duanqiao',label:'断桥残雪'},
 {id:'sudi',label:'苏堤春晓'},
 {id:'pinghu',label:'平湖秋月'},
 {id:'quyuan',label:'曲院风荷'},
 {id:'huagang',label:'花港观鱼'},
 {id:'liulang',label:'柳浪闻莺'},
 {id:'santan',label:'三潭印月'},
 {id:'shuangfeng',label:'双峰插云'},
 {id:'leifeng',label:'雷峰夕照'},
 {id:'nanping',label:'南屏晚钟'}
];
/* 每层对齐表：true=有对齐可跟随；false=暂无对齐（不假飞，出 §7.3 提示） */
const ALIGN={
 all:       {huajuan:true, fuyuan:true,  jintu:true},
 duanqiao:  {huajuan:true, fuyuan:true,  jintu:true},
 sudi:      {huajuan:true, fuyuan:true,  jintu:true},
 pinghu:    {huajuan:true, fuyuan:false, jintu:false},
 quyuan:    {huajuan:true, fuyuan:false, jintu:true},
 huagang:   {huajuan:true, fuyuan:false, jintu:false},
 liulang:   {huajuan:true, fuyuan:false, jintu:false},
 santan:    {huajuan:true, fuyuan:false, jintu:true},
 shuangfeng:{huajuan:true, fuyuan:false, jintu:false},
 leifeng:   {huajuan:true, fuyuan:true,  jintu:true},
 nanping:   {huajuan:true, fuyuan:false, jintu:false}
};
const NAMES={duanqiao:'duanqiao',baoshuta:'all',leifengta:'leifeng'}; // 细选地名 → 所属十景
const state={layer:'huajuan',scene:'all',yx:false}; // yx=圆相观感态（壳内，不升第四层）

const seg=document.getElementById('seg'),chips=document.getElementById('chips'),
      notice=document.getElementById('notice'),sub=document.getElementById('sub'),
      frames=[...document.querySelectorAll('.stage iframe')];

SCENES.forEach(s=>{
  const b=document.createElement('button');
  b.className='chip'+(s.id==='all'?' on':'');b.textContent=s.label;b.dataset.scene=s.id;
  b.onclick=()=>selectScene(s.id===state.scene?'all':s.id); // 再点同 chip 取消回全卷
  chips.appendChild(b);
});

seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;selectLayer(b.dataset.layer);
});
document.getElementById('names').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  selectScene(NAMES[b.dataset.name]||'all');
  [...document.querySelectorAll('#names button')].forEach(x=>x.classList.toggle('on',x===b));
});

function selectLayer(l){
  state.layer=l;state.yx=false;
  [...seg.children].forEach(b=>b.classList.toggle('on',b.dataset.layer===l));
  frames.forEach(f=>{
    const on=f.dataset.layer===l;
    if(on&&!f.src&&f.dataset.src)f.src=f.dataset.src; // 懒加载
    f.classList.toggle('on',on);
  });
  render();
}
function toggleYx(on){
  state.yx=on;
  const f=frames.find(x=>x.dataset.layer==='yuanxiang');
  if(on&&!f.src)f.src=f.dataset.src; // 首次进入才载；之后常驻不卸（XQ-08 防白闪）
  frames.forEach(x=>x.classList.toggle('on',x.dataset.layer===(on?'yuanxiang':state.layer)));
  render();
}
function selectScene(s){
  state.scene=s;
  [...chips.children].forEach(c=>c.classList.toggle('on',c.dataset.scene===s));
  render();
}
function render(){
  const label=SCENES.find(s=>s.id===state.scene).label;
  if(state.yx){
    // 圆相跟选中：本机无其源码、无深链 API，不假飞——出对照指引（诚实态）
    notice.textContent=state.scene==='all'
      ? '圆相观感：用其自带「叠合 / 仅今 / 仅圆」与章节 A–E 对照。'
      : '圆相随壳选中「'+label+'」：请在圆相内用叠合模式对照该景；自动飞行待其开放深链接口。';
  }else{
    const aligned=ALIGN[state.scene][state.layer];
    // §7.3：缺对齐不假飞，弱提示一行
    notice.textContent=aligned
      ? (state.scene==='all'?'':'已收束到「'+label+'」——本层有对齐。')
      : '此层暂无对齐 · 换层或换名再试';
  }
  // 圆相次级入口（仅复原/今图层露出；壳内切换，不跳站）
  if(state.yx){
    sub.innerHTML='<button id="yx-off">← 返回本层</button>';
    document.getElementById('yx-off').onclick=()=>toggleYx(false);
  }else if(state.layer==='fuyuan'||state.layer==='jintu'){
    sub.innerHTML='次级入口：<button id="yx-on">圆相</button>';
    document.getElementById('yx-on').onclick=()=>toggleYx(true);
  }else sub.innerHTML='';
  // URL 深链：壳 + 层 + 十景 + 圆相态（禁深链到独立站）
  history.replaceState(null,'','#layer='+state.layer+'&scene='+state.scene+(state.yx?'&yx=1':''));
}
/* 深链还原 */
const h=location.hash.match(/layer=(\w+)/),hs=location.hash.match(/scene=(\w+)/),hyx=/yx=1/.test(location.hash);
if(hs&&SCENES.some(s=>s.id===hs[1]))selectScene(hs[1]);
if(h&&['huajuan','fuyuan','jintu'].includes(h[1]))selectLayer(h[1]);else render();
if(hyx&&(state.layer==='fuyuan'||state.layer==='jintu'))toggleYx(true);
</script>
</body>
</html>
